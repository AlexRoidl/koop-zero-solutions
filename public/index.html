<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meme Generator</title>
<link rel="preload" href="/fonts/Anton.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/HersheySimplexPlus-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body class="editor">

  <div id="top">
    <div class="cluster">
      <div class="brand"><span class="logo">MEME</span><span class="sub">Generator</span></div>
      <a class="nav-link" href="/overview">Overview →</a>
    </div>
    <div class="cluster actions">
      <button id="btn-random" title="Neues Zufallsbild">🎲 <span>Neues Bild</span></button>
      <button id="btn-add-text">＋ <span>Text</span></button>
      <button id="btn-save" class="solid">💾 <span>Speichern</span></button>
    </div>
  </div>

  <div id="stage">
    <div class="wrap">
      <canvas id="board" width="600" height="600"></canvas>
    </div>
  </div>
  <div class="stage-hint" id="hint">Text antippen zum Auswählen · ziehen = bewegen · Ecke = skalieren</div>

  <div id="imgbar">
    <textarea id="layer-text" rows="1" placeholder="Dein Text…" spellcheck="false"></textarea>
    <button class="sq" id="btn-invert" title="Schwarz / Weiß tauschen">🔁</button>
    <button class="sq" id="btn-del" title="Text löschen">🗑️</button>
  </div>

  <div id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
